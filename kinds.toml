# Kind registry policy (spec §5.7, §17.8). One table per kind; see crates/vc-kinds for the rules
# the loader enforces. JSON pointers in `verbatim` may use `*` for "every array element";
# the loader expands it to concrete indices (0 .. the schema's maxItems).
# `source_classes = []` would mean "all"; every v1 kind lists its classes explicitly.

[kinds.activity]
version = 1
storage = "record"
source_classes = ["official", "reference", "editorial", "commercial_api"]
verbatim = ["/price/text", "/price/amount", "/booking_url", "/phone", "/source_url", "/as_of", "/evidence/*"]

[kinds.advisory]
version = 1
storage = "record"
source_classes = ["official"]
verbatim = ["/issued_date", "/updated_date", "/level", "/regions/*/level", "/source_url", "/as_of", "/evidence/*"]
high_stakes = true

[kinds.airport]
version = 1
storage = "record"
source_classes = ["official", "reference", "commercial_api"]
