  6 MB, one conditional request a year), sheet A1.3.3.2 (vehicle occupancies based on vehicle-km travelled,
  2023 value year (car from NTS 2009-12, PSV from NTS 1999-2001: base_years), all-week average, driver
  included (stated for car, derived for PSV: method_note); two-row header, merged vehicle-type cells)
