# Voyager Crawler on one VM (spec §6, §17.1, §17.5).
#
# Run only through the host scripts (deploy.sh, voyager-crawler.service), which
# always pass:  -p voyager-crawler -f /opt/voyager-crawler/compose.yaml
#               --env-file /var/lib/voyager-crawler/deploy/image.env
# image.env holds VC_IMAGE=ghcr.io/rupakc/voyager-crawler@sha256:… (the last
# cosign-verified digest) and VC_API_BIND (the reserved internal IP).
#
# Contract with the vcrawl image (Task 15 implements it):
#   ENTRYPOINT ["vcrawl"]; the command is `run` (every role in one process,
#   the 4 GB Spot e2-medium); `vcrawl <role>` still runs one role alone.
#   `vcrawl health` exits 0 when every role in this container is up and
#   healthy. It is progress-based: e.g. the fetcher fails it after 10 min
#   without a completion while due work exists.
#   Secrets arrive as files (/run/secrets/*), never as environment values.
#   Labels: io.voyager-crawler.schema (highest migration the image ships),
#   io.voyager-crawler.min-schema (lowest schema it runs against) and
#   io.voyager-crawler.migrations (every migration it ships, comma-separated;
#   deploy.sh requires each in _sqlx_migrations).
#
# Networks:
#   db        internal: Postgres and vcrawl. No route out.
#   render    internal: Chromium and its only peer, vcrawl's fetcher (CDP). No
#             route out, so every Chromium request is paused and fulfilled by
#             the fetcher under the page's permit (§17.1).
#   egress    vcrawl (GCS, Vertex, the metadata server and, through
#             vc-frontier permits only, the web) and otelcol.
#   pgbackup  Postgres alone: wal-g's route to gs://voyager-crawler-ops. No
#             other container shares it, and no port is published on it.
# Memory limits (Spot e2-medium, 4 GB; a 2 GB swap file is the safety net only):
#   postgres 1152m + chromium 768m + vcrawl 1024m + otelcol 96m + migrate 128m
#   = 3168 MiB (3.32 GB) ≤ 3.4 GB, leaving the host OS, Docker and the Ops Agent
#   the rest. crates/vc-config/tests/deploy_env.rs checks the sum; the E2E job
#   measures the peak (e2e/run.sh, must stay under 3.2 GB).

name: voyager-crawler

x-role: &role
  image: ${VC_IMAGE:?VC_IMAGE is set by deploy.sh}
  restart: unless-stopped
  init: true
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  secrets: [pg_password]
  environment: &role-env
    # Every VC_* name is a vc-config setting (VC_<SECTION>_<FIELD>) or a secret
    # file listed in vc_config::SECRET_FILE_VARS; crates/vc-config/tests/deploy_env.rs
    # loads Config with exactly this environment and fails on any other name.
    VC_DATABASE_URL: postgres://vcrawl@postgres:5432/vcrawl
    VC_DATABASE_PASSWORD_FILE: /run/secrets/pg_password
    VC_STORE_RAW_BUCKET: voyager-crawler-raw
    VC_STORE_OPS_BUCKET: voyager-crawler-ops
    VC_LLM_GCP_PROJECT: voyager-prod-ohzkl
    VC_SECRETS_PROJECT: voyager-prod-ohzkl
    VC_OBS_LOG_FORMAT: json
    VC_LLM_ENABLED: ${VC_LLM_ENABLED:-false}
    # The owner's project cap (host.local.env, infrastructure/README.md step 3);
    # 0 = unset: llm.enabled is refused until it is raised.
    VC_PROJECT_CAP_USD: ${VC_PROJECT_CAP_USD:-0}
    # The crawler's monthly LLM cap (host.local.env; infrastructure/README.md "Cost"),
    # at most 50 % of VC_PROJECT_CAP_USD. Every role gets it, so all of them validate
    # [llm] alike; the default is llm.monthly_usd's.
    VC_LLM_MONTHLY_USD: ${VC_LLM_MONTHLY_USD:-30}
    # Go-live ramp (docs/runbooks/go-live.md §3): first-boot.sh puts
    # VC_VCRAWL_SOURCE_ALLOWLIST=/app/sources/ramp-1.txt in host.local.env on a
    # fresh install; only those sources are seeded and fetched. Empty = all.
    VC_VCRAWL_SOURCE_ALLOWLIST: ${VC_VCRAWL_SOURCE_ALLOWLIST:-}
  healthcheck:
    test: ["CMD", "vcrawl", "health"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s
  depends_on:
    postgres: { condition: service_healthy }
  networks: [db, egress]

services:
  postgres:
    # Postgres 17 + pgvector, pinned by digest. wal-g is the host's pinned,
    # checksum-verified binary (first-boot.sh), mounted read-only.
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    shm_size: 256m
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: vcrawl
      POSTGRES_DB: vcrawl
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password_db
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file: [/opt/voyager-crawler/postgres/walg.env]
    secrets: [pg_password_db]
    volumes:
      - /var/lib/voyager-crawler/pgdata:/var/lib/postgresql/data
      - /opt/voyager-crawler/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /opt/voyager-crawler/bin/wal-g:/usr/local/bin/wal-g:ro
      # The pgvector image ships no CA bundle: without the host's, wal-g's TLS to
      # storage.googleapis.com fails ("certificate signed by unknown authority") and
      # WAL archiving and base backups never succeed.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcrawl -d vcrawl"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources: { limits: { memory: 1152m } }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [db, pgbackup]

  chromium:
    # chromedp/headless-shell 158.0.8127.18, pinned by digest. Chrome's own
    # sandbox stays on (no --no-sandbox): Chrome's seccomp profile allows the
    # user-namespace calls it needs; non-root, read-only root filesystem.
    image: chromedp/headless-shell:158.0.8127.18@sha256:830fa77e0602cb42e5cb2cbd9237ba27b649ad69d5fb82b54713aac8b7ab4f29
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["seccomp=/opt/voyager-crawler/chromium/seccomp.json", "no-new-privileges:true"]
    tmpfs: ["/tmp:size=512m", "/home/chromium:size=64m,uid=1000,gid=1000"]
    shm_size: 512m
    environment: { HOME: /home/chromium }
    # deploy/chromium/run.sh (the script the vc-render tests start the same
    # image with): Chromium's DevTools on 127.0.0.1:9223, socat forwards :9222
    # (current headless-shell builds ignore --remote-debugging-address).
    entrypoint: ["/bin/sh", "/opt/voyager-crawler/chromium/run.sh"]
    volumes:
      - /opt/voyager-crawler/chromium/run.sh:/opt/voyager-crawler/chromium/run.sh:ro
    # No health check of its own: a broken Chromium fails the fetcher's
    # progress health (renders stop completing), and the watchdog restarts it
    # One tab at a time (render.max_tabs 1), a fresh browser context per
    # render and a new CDP session every render.restart_after_renders (50),
    # V8 heap capped per renderer (run.sh). Over the limit the kernel kills
    # Chromium, the container exits and Docker restarts it.
    deploy:
      resources: { limits: { memory: 768m } }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    networks: [render]

  otelcol:
    # OpenTelemetry Collector contrib 0.164.0, pinned by digest. Scrapes
    # vcrawl's :9464 (every role's series, labelled role=…) and writes custom.googleapis.com/crawler/* to Cloud
    # Monitoring (deploy/otelcol/config.yaml says why the Ops Agent cannot).
    # Credentials: the metadata server (egress network).
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - /opt/voyager-crawler/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    deploy:
      resources: { limits: { memory: 96m } }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    networks: [egress, metrics]

  vcrawl:
    # Every role in one process (`vcrawl run`, crates/vcrawl/src/run.rs): one tokio
    # runtime, one Postgres pool sized for the roles, one /metrics + /healthz on the
    # metrics network, heartbeats per role. SIGTERM: fetches in flight finish, the
    # spool is flushed, leases are released, within vcrawl.shutdown_grace_s (20 s; shutdown.sh stops with -t 25).
    <<: *role
    command: ["run"]
    secrets: [pg_password, api_token_voyager, api_tls_key, api_tls_cert]
    environment:
      <<: *role-env
      VC_RENDER_CDP_URL: http://chromium:9222
      VC_STORE_SPOOL_DIR: /spool
      # Stable instance: the spool dir (spool/fetcher-<instance>/) survives recreation.
      # (A fetcher-* spool of the old per-role topology is adopted at start.)
      VC_VCRAWL_INSTANCE: vcrawl
      # Small VM: 8 keys in flight, 2 captures processed at once.
      VC_VCRAWL_FETCHER_CONCURRENCY: 8
      VC_VCRAWL_PROCESSOR_CONCURRENCY: 2
      # /metrics + /healthz only on the metrics network, never on `render` (Chromium).
      VC_OBS_METRICS_ADDR: 192.168.250.2:9464
      # The read API (TLS + client tokens). Chromium shares the render network but every
      # request it makes is paused by CDP Fetch interception and answered by the fetcher;
      # WebSockets would still meet TLS and the token check.
      VC_API_BIND: 0.0.0.0:8443
      # TLS: the matched key/cert pair deploy.sh installed (/run/secrets/api_tls_*,
      # never a half-rotated one), else Secret Manager by name (api.tls_*_secret);
      # client tokens are argon2 hashes in api_clients, so no token file.
    volumes:
      - /var/lib/voyager-crawler/spool:/spool
    # Published on the reserved internal IP only; the firewall admits
    # tcp:8443 from the app VM's service account alone
    ports: ["${VC_API_BIND:?VC_API_BIND is set by first-boot.sh}:8443:8443"]
    depends_on:
      postgres: { condition: service_healthy }
      chromium: { condition: service_started }
    deploy: { resources: { limits: { memory: 1024m } } }
    networks:
      db: {}
      egress: {}
      render: {}
      metrics: { ipv4_address: 192.168.250.2 }

  # One-shot, run by deploy.sh before any role rolls (expand-only, §17.6).
  # `migrate --contract` (run by hand) refuses while a rollback is listed in
  # <data_dir>/deploy/rollbacks, so deploy.sh's rollback log is mounted
  # read-only at that path (deploy.sh creates it before every migrate).
  migrate:
    <<: *role
    command: ["migrate"]
    restart: "no"
    healthcheck: { disable: true }
    profiles: [tools]
    volumes:
      - type: bind
        source: /var/lib/voyager-crawler/deploy/rollbacks
        target: /var/lib/voyager-crawler/deploy/rollbacks
        read_only: true
        bind: { create_host_path: false }
    deploy: { resources: { limits: { memory: 128m } } }

secrets:
  # Written by deploy.sh from Secret Manager into tmpfs (/run), mode 0400,
  # owned by the reading uid: 999 (postgres) for *_db, 65532 for the roles
  pg_password_db: { file: /run/voyager-crawler/secrets/pg_password_db }
  pg_password: { file: /run/voyager-crawler/secrets/pg_password }
  api_token_voyager: { file: /run/voyager-crawler/secrets/api_token_voyager }
  api_tls_key: { file: /run/voyager-crawler/secrets/api_tls_key }
  api_tls_cert: { file: /run/voyager-crawler/secrets/api_tls_cert }

networks:
  db: { internal: true }
  render: { internal: true }
  # otelcol ↔ vcrawl metrics only (vcrawl's /metrics is bound to its address here so
  # the render network, which Chromium shares, cannot reach it).
  metrics:
    internal: true
    # Dynamic addresses come only from .4-.7, so vcrawl's fixed .2 is never handed to
    # a container that starts first (otelcol took it on the first real boot).
    ipam: { config: [{ subnet: 192.168.250.0/29, ip_range: 192.168.250.4/30 }] }
  egress: {}
  pgbackup: {}
