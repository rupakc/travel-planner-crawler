# OpenTelemetry Collector (contrib) for the crawler's own metrics (spec §6, §11).
#
# Why not the Ops Agent: its Prometheus receiver always writes
# prometheus.googleapis.com/<name>/<kind>, and the alert policies in
# infrastructure/monitoring/ (and vc-obs's naming rule) read
# custom.googleapis.com/crawler/<x>. The Ops Agent stays on the host for host
# metrics (agent.googleapis.com/disk/..., the disk-usage alert) and logs.
#
# Why keep a collector at all (≈ 40–60 MB) when vcrawl is one process: writing
# Cloud Monitoring from vcrawl would need a new exporter, its auth and its
# retry queue in the crawler binary; the collector already does that, pinned
# and memory-limited, and keeps credentials for Monitoring out of vcrawl.
#
# Pipeline: scrape vcrawl's /metrics on :9464 → keep only crawler_* →
# rename crawler_<x>[_total] → custom.googleapis.com/crawler/<x> (the vc-obs
# rule, `cloud_monitoring_type`) → Cloud Monitoring as the gce_instance
# resource, with credentials from the metadata server (the VM's runtime SA has
# roles/monitoring.metricWriter). Every series carries the role it is about
# as a label where it matters (crawler_heartbeat{role}); the scrape job
# (`vcrawl`) becomes the label `service_name`.
# `$$` is the collector's escape for a literal `$`.

receivers:
  prometheus:
    config:
      scrape_configs:
        # One process runs every role (`vcrawl run`); each series keeps its `role` label
        # (crawler_heartbeat{role="fetcher"}, …). Bound to its metrics-network address
        # only (deploy/compose.yaml), never to the render network Chromium shares.
        - job_name: vcrawl
          scrape_interval: 60s
          static_configs: [{ targets: ["192.168.250.2:9464"] }]

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 64                 # container limit 96m (deploy/compose.yaml)
    spike_limit_mib: 16
  filter/crawler:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^crawler_")'
  metrics_transform/cloud-type:
    transforms:
      - include: ^crawler_(.+?)(_total)?$
        match_type: regexp
        action: update
        new_name: custom.googleapis.com/crawler/$${1}
  resourcedetection:
    detectors: [gcp]
    timeout: 10s
    override: true
  batch:
    timeout: 10s

exporters:
  googlecloud:
    project: voyager-prod-ohzkl
    metric:
      # Names that already carry a domain (custom.googleapis.com/...) are used
      # as-is; this prefix only marks anything that slipped through the rename.
      prefix: custom.googleapis.com/crawler-unmapped/
      resource_filters:
        - prefix: service.name
    sending_queue:
      enabled: true
      queue_size: 100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, filter/crawler, metrics_transform/cloud-type, resourcedetection, batch]
      exporters: [googlecloud]
