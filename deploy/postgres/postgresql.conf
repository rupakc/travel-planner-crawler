# Voyager Crawler Postgres 17 (+ pgvector). Container memory limit 1152 MiB
# (Spot e2-medium, 4 GB for everything; deploy/compose.yaml).
# Mounted read-only by compose.yaml; changes ship with the host bundle and
# take effect at the next postgres restart.

listen_addresses = '*'            # the internal `db` network only (compose)
port = 5432
max_connections = 40             # vcrawl run's pool (~19) + migrate/admin/health
password_encryption = scram-sha-256

# Memory: 384 MB buffers inside a 1152 MiB limit (≈ 40 backends × a few MB,
# maintenance and autovacuum on top); the OS page cache does the rest.
# maintenance_work_mem bounds HNSW builds (pgvector spills to disk beyond it).
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
wal_buffers = 8MB
huge_pages = off

# pd-balanced (SSD-backed)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and archiving (wal-g → gs://voyager-crawler-ops/walg, kept 14 d by
# the bucket lifecycle). archive_timeout bounds the archive age that
# the "backup/WAL archive age > 2 h" alert watches.
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = '/usr/local/bin/wal-g wal-push "%p"'
archive_timeout = 15min
restore_command = '/usr/local/bin/wal-g wal-fetch "%f" "%p"'

# Autovacuum (§17.9: url_state updates aren't HOT; partitions are vacuumed
# eagerly, and partitions override scale_factor where needed)
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# Safety
statement_timeout = 0             # set per role/session by vcrawl
lock_timeout = 0                  # migrations SET lock_timeout = '5s'
idle_in_transaction_session_timeout = 10min

# Logging: to stderr (docker json-file → Ops Agent); never query text with
# parameters (they may carry page content)
log_destination = 'stderr'
log_min_duration_statement = 5s
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_checkpoints = on
log_autovacuum_min_duration = 30s
log_lock_waits = on

shared_preload_libraries = 'pg_stat_statements'
