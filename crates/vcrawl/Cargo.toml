[package]
name = "vcrawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Voyager crawler binary: roles, admin CLI and migrate."

[lints]
workspace = true

[dependencies]
rustls = { workspace = true }
vc-core = { workspace = true }
vc-config = { workspace = true }
vc-policy = { workspace = true }
vc-frontier = { workspace = true }
vc-fetch = { workspace = true }
vc-render = { workspace = true }
vc-store = { workspace = true }
vc-parse = { workspace = true }
vc-kinds = { workspace = true }
vc-llm = { workspace = true }
vc-extract = { workspace = true }
vc-sources = { workspace = true }
vc-queue = { workspace = true }
vc-index = { workspace = true }
vc-api = { workspace = true }
vc-obs = { workspace = true }
vc-secrets = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
fail = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
bytes = { workspace = true }
figment = { workspace = true }
url = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
crc32c = { workspace = true }
sha2 = { workspace = true }

[features]
# Compiles the `fail` failpoints in (the failpoint tests enable it through dev-dependencies).
failpoints = ["fail/failpoints", "vc-store/failpoints"]

[dev-dependencies]
testkit = { workspace = true }
axum = { workspace = true }
figment = { workspace = true, features = ["test"] }
fail = { workspace = true, features = ["failpoints"] }
vc-store = { workspace = true, features = ["failpoints"] }
tempfile = { workspace = true }
reqwest = { workspace = true }
bzip2 = { workspace = true }
