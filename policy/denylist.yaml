# Hosts VoyagerBot never requests (spec §2 anti-goals, §5.2; research docs/research/sources.md §0).
# Read by vc-policy (Policy::denied), the source scout and scripts/seeds_to_sources.py.
#
# Entry: {host, reason, source} plus an optional path_prefix.
#   host         a host name; it matches that host and every subdomain of it
#                (booking.com matches www.booking.com, m.booking.com).
#                "<brand>.*" matches the brand label directly under ANY public suffix
#                (expedia.* matches expedia.com, www.expedia.co.uk, expedia.de) – the
#                organisation rule from review r3 #8.
#   path_prefix  only URLs whose path starts with this prefix are denied.
#   except_hosts partner-API hosts of a denied organisation (and their subdomains) that are
#                NOT covered by the entry. Usable only under a signed partner agreement;
#                the matching sources/*.yaml stay enabled: false until then.
#   source       where the decision comes from: a seeds.yaml id ("seed:<id>"),
#                "sources.md §N", or "brand" (brand domain of a denied organisation).
#
# Removing an entry needs the owner's approval in the PR (CODEOWNERS). Adding one never does.
